<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>АСУИР — Исполнение</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        select,
        button {
            font-size: 1em;
            margin: 0.5em 0;
        }

        .block {
            border: 1px solid #ccc;
            padding: 1em;
            margin-top: 1em;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
            margin-top: 1em;
        }

        code {
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .linked,
        .scenario {
            margin-top: 1em;
        }

        .scenario h3 {
            margin-bottom: 0.2em;
        }

        .mind {
            background: #f0f8ff;
            padding: 0.5em;
            border-left: 4px solid #339;
            margin-bottom: 1em;
        }

        .highlight {
            background: #d8ffd8;
        }
    </style>
    <script src="mind-adaptor.js"></script>
    <script src="logor-recorder.js"></script>
</head>

<body>

    <header>
        <h1>Исполнение Узла</h1>
        <p class="sub">Запуск смыслов, маршрутов, состояний</p>
    </header>

    <div id="mind" class="mind" style="display:none;">
        <p><strong>🎯 Цель:</strong> <span id="mind-intent"></span></p>
        <p><strong>📜 Сценарий:</strong> <span id="mind-scenario"></span></p>
        <p><strong>🔄 Состояние:</strong> <span id="mind-state"></span></p>
        <p><strong>🔜 Следующий шаг:</strong> <span id="mind-next"></span></p>
    </div>

    <section class="scenario">
        <h3>Сценарий:</h3>
        <select id="scenario-select"></select>
        <button id="start-scenario">▶ Начать сценарий</button>
    </section>

    <section>
        <h3>Или вручную:</h3>
        <label>Узел:
      <select id="node-select"></select>
    </label>
        <button id="run">▶️ Выполнить</button>
    </section>

    <div id="output" class="block" style="display:none;">
        <h3>Реакция:</h3>
        <p><strong>Название:</strong> <span id="node-title"></span></p>
        <p><strong>Описание:</strong> <span id="node-desc"></span></p>
        <div id="reaction"></div>
        <div class="linked">
            <strong>Связан с:</strong>
            <ul id="linked-list"></ul>
        </div>
    </div>

    <footer>
        <a href="panel.html">← Панель</a>
    </footer>

    <script>
        let nodes = [], links = [], scripts = [], scenario = null, step = 0;
    let mind = null;

    Promise.all([
      fetch('core.json').then(res => res.json()),
      fetch('links.json').then(res => res.json()),
      fetch('exec.json').then(res => res.json()),
      fetch('mind.json').then(res => res.json()).catch(() => null)
    ]).then(([n, l, s, m]) => {
      nodes = n; links = l; scripts = s; mind = m;
      const nodeSel = document.getElementById('node-select');
      const scnSel = document.getElementById('scenario-select');

      nodes.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n.id;
        opt.textContent = `[${n.id}] ${n.title}`;
        nodeSel.appendChild(opt);
      });

      scripts.forEach((s, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = s.title;
        scnSel.appendChild(opt);
      });

      if (mind) showMind(mind);

      const url = new URL(window.location.href);
      const scenarioFromURL = url.searchParams.get('scenario');
      if (scenarioFromURL) {
        const found = scripts.find(s => s.title === decodeURIComponent(scenarioFromURL));
        if (found) {
          scenario = found;
          step = 0;
          runStep();
        }
      }
    });

    function showMind(data) {
      document.getElementById('mind-intent').textContent = data.intent || '–';
      document.getElementById('mind-scenario').textContent = data.scenario || '–';
      document.getElementById('mind-state').textContent = data.state || '–';
      document.getElementById('mind-next').textContent = data.next || '–';
      document.getElementById('mind').style.display = 'block';
    }

    document.getElementById('run').addEventListener('click', () => {
      const id = document.getElementById('node-select').value;
      executeNode(id);
    });

    document.getElementById('start-scenario').addEventListener('click', () => {
      const idx = document.getElementById('scenario-select').value;
      scenario = scripts[idx];
      step = 0;
      if (scenario && scenario.steps.length > 0) runStep();
    });

    function runStep() {
      if (!scenario || step >= scenario.steps.length) return;
      const id = scenario.steps[step];
      executeNode(id);
      step++;
      if (step < scenario.steps.length) setTimeout(runStep, 2000);
    }

    function executeNode(id) {
      const node = nodes.find(n => n.id === id);
      const output = document.getElementById('output');
      document.getElementById('node-title').textContent = node.title;
      document.getElementById('node-desc').textContent = node.description;
      output.style.display = 'block';

      const reaction = document.getElementById('reaction');
      reaction.innerHTML = '';

      if (node.type === 'iframe' && node.target) {
        reaction.innerHTML = `<iframe src="${node.target}"></iframe>`;
      } else if (node.type === 'text') {
        reaction.innerHTML = `<p><em>Это описательный узел. Нет исполнения.</em></p>`;
      } else {
        reaction.innerHTML = `<p><em>Нет специфической реакции. Тип узла: <code>${node.type || 'none'}</code></em></p>`;
      }

      const list = document.getElementById('linked-list');
      list.innerHTML = '';
      const related = links.filter(l => l.source === id);
      related.forEach(link => {
        const targetNode = nodes.find(n => n.id === link.target);
        if (targetNode) {
          const li = document.createElement('li');
          const btn = document.createElement('button');
          btn.textContent = `${targetNode.title} (${link.type})`;
          btn.onclick = () => executeNode(targetNode.id);
          li.appendChild(btn);
          list.appendChild(li);
        }
      });

      if (mind && mind.next === id) {
        output.scrollIntoView({ behavior: "smooth" });
        output.classList.add('highlight');
      } else {
        output.classList.remove('highlight');
      }

      // ✅ запись в лог
      if (typeof logAction === 'function') {
        logAction({ intent: mind?.intent || '–', actor: 'исполнитель', node: id });
      }

      // ✅ обновление мышления
      if (typeof updateMind === 'function') {
        updateMind(id, scenario?.title);
      }
    }
    </script>

</body>

</html>
